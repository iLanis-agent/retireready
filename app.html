<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RetireReady - know when to stop repairing the dishwasher</title>
<style>
  :root { --ink:#26292e; --muted:#767d86; --accent:#5865a8; --accent-dk:#454f85; --card:#ffffff; --bg:#f5f6f9; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:680px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:28px; margin:0 0 6px; }
  .tag { color:var(--muted); margin:0 0 20px; line-height:1.45; }
  .card { background:var(--card); border:1px solid #e0e3ec; border-radius:14px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input, select { padding:9px 10px; border:1px solid #ccd2de; border-radius:8px; font-size:15px; background:#fff; }
  input[type=date] { width:160px; }
  input[type=number] { width:100px; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button:hover { background:var(--accent-dk); }
  button.ghost { background:#e9ecf4; color:var(--ink); }
  button.ghost:hover { background:#dbe0ee; }
  .pill { display:inline-block; padding:3px 12px; border-radius:999px; font-size:12px; font-weight:700; }
  .pill.young { background:#e2f0e6; color:#2f6f45; }
  .pill.midlife { background:#f6ecd2; color:#8a6a14; }
  .pill.senior { background:#f6e0dd; color:#8f3a33; }
  .pill.overtime { background:#f6e0dd; color:#8f3a33; }
  .app { border:1px solid #e0e3ec; border-radius:10px; padding:14px; margin-bottom:10px; }
  .app .top { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .app .nm { font-weight:700; font-size:16.5px; }
  .app .meta { color:var(--muted); font-size:13.5px; margin-top:2px; }
  .bar { height:7px; background:#e9ecf4; border-radius:99px; overflow:hidden; margin:10px 0 4px; }
  .bar i { display:block; height:100%; background:var(--accent); border-radius:99px; }
  .pct { color:var(--muted); font-size:12.5px; }
  .calc { margin-top:10px; padding-top:10px; border-top:1px dashed #dbe0ee; display:none; }
  .calc.show { display:block; }
  .verdict { margin-top:10px; padding:10px 12px; border-radius:8px; font-size:14.5px; line-height:1.45; }
  .verdict.repair { background:#e2f0e6; color:#23583a; }
  .verdict.replace { background:#f6e0dd; color:#8f3a33; }
  .verdict.borderline { background:#f6ecd2; color:#8a6a14; }
  .app .btns { margin-top:8px; display:flex; gap:8px; }
  .app .btns button { font-size:13px; padding:7px 12px; }
  .empty { color:var(--muted); text-align:center; padding:20px 0; font-size:15px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>RetireReady</h1>
  <p class="tag">Every appliance is quietly aging toward the repair-or-replace question. RetireReady tracks each one's age against its typical lifespan, and applies the 50% rule when a repair quote lands so the answer is math, not vibes.</p>

  <div class="card">
    <div class="row">
      <div><label for="type">Appliance</label><select id="type"></select></div>
      <div><label for="bought">Purchased</label><input type="date" id="bought"></div>
      <div><label for="life">Typical life (yrs)</label><input type="number" id="life" value="10" min="1" max="30"></div>
      <button id="addBtn">Track it</button>
    </div>
  </div>

  <div id="list"></div>
  <div class="empty" id="empty">Nothing tracked yet. Add the appliances you own.</div>
</div>
<script src="engine.js"></script>
<script>
(function(){
  var E = RetireReadyEngine;
  var KEY = 'retireready.v1';
  var st = {items:[]};
  try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.items) st = s; } catch(e){}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }
  function $(id){ return document.getElementById(id); }
  function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  var sel = $('type');
  Object.keys(E.LIFESPANS).forEach(function(k){
    var o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o);
  });
  sel.addEventListener('change', function(){ $('life').value = E.LIFESPANS[sel.value]; });
  $('life').value = E.LIFESPANS[sel.value];

  function render(){
    var now = Date.now();
    $('empty').classList.toggle('hidden', st.items.length > 0);
    var html = '';
    st.items.forEach(function(a, i){
      var purch = new Date(a.bought + 'T12:00:00').getTime();
      if (isNaN(purch)) return;
      var age = E.ageYears(purch, now);
      var s = E.status(age, a.life);
      var pct = Math.min(Math.round(s.pct * 100), 130);
      html += '<div class="app" data-i="' + i + '">' +
        '<div class="top"><span class="nm">' + esc(a.type) + '</span><span class="pill ' + s.key + '">' + s.label + '</span></div>' +
        '<div class="meta">age ' + E.fmtAge(age) + ' of a typical ' + a.life + '-year life</div>' +
        '<div class="bar"><i style="width:' + Math.min(pct, 100) + '%"></i></div>' +
        '<div class="pct">' + pct + '% of expected lifespan used</div>' +
        '<div class="btns"><button class="ghost" data-act="calc">Repair quote?</button><button class="ghost" data-act="del">Remove</button></div>' +
        '<div class="calc" id="calc' + i + '">' +
          '<div class="row">' +
            '<div><label>Repair quote</label><input type="number" min="0" data-f="repair" placeholder="250"></div>' +
            '<div><label>New unit price</label><input type="number" min="0" data-f="replace" placeholder="900"></div>' +
            '<button data-act="judge">Judge it</button>' +
          '</div>' +
          '<div class="vout" id="vout' + i + '"></div>' +
        '</div>' +
      '</div>';
    });
    $('list').innerHTML = html;
  }

  $('addBtn').addEventListener('click', function(){
    if (!$('bought').value) return;
    var life = parseInt($('life').value, 10);
    if (!(life >= 1)) return;
    st.items.push({type:sel.value, bought:$('bought').value, life:life});
    save(); render();
  });

  $('list').addEventListener('click', function(ev){
    var btn = ev.target.closest('button'); if (!btn) return;
    var box = ev.target.closest('.app'); if (!box) return;
    var i = parseInt(box.getAttribute('data-i'), 10);
    var a = st.items[i]; if (!a) return;
    var act = btn.getAttribute('data-act');
    if (act === 'del'){ st.items.splice(i, 1); save(); render(); return; }
    if (act === 'calc'){ $('calc' + i).classList.toggle('show'); return; }
    if (act === 'judge'){
      var repair = parseFloat(box.querySelector('[data-f=repair]').value);
      var replace = parseFloat(box.querySelector('[data-f=replace]').value);
      var purch = new Date(a.bought + 'T12:00:00').getTime();
      var age = E.ageYears(purch, Date.now());
      var v = E.verdict(E.lifePct(age, a.life), repair, replace);
      var out = $('vout' + i);
      if (!v){ out.innerHTML = '<div class="verdict borderline">Enter both the repair quote and the price of a new unit.</div>'; return; }
      out.innerHTML = '<div class="verdict ' + v.key + '"><b>' + v.key.toUpperCase() + '</b> - ' + esc(v.reason) + '. (' + E.money(repair) + ' repair vs ' + E.money(replace) + ' new)</div>';
    }
  });

  render();
})();
</script>
</body>
</html>
